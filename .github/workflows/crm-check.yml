# Проверка CRM на сервере, только чтение: справочник IMEI, обученные коды, функции подсказок.
# Персональные данные и секреты в журнал не выводятся.
name: CRM check
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "imei, counts или live"
        required: true
        default: imei
permissions:
  contents: read
concurrency: { group: server, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      H: ${{ secrets.DEPLOY_HOST }}
      STAGE: ${{ inputs.stage }}
    steps:
      - name: SSH
        env: { K: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          case "$STAGE" in imei|counts|live) ;; *) echo "stage: imei, counts или live"; exit 1;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^$/d' > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 20 -t ed25519 "$H" 2>/dev/null > ~/.ssh/known_hosts
      - name: Справочник IMEI
        if: inputs.stage == 'imei'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -u
          q() { docker exec supabase-db psql -U postgres -d postgres -qAt -F ' | ' -c "$1" </dev/null 2>&1; }
          echo "== таблицы"; q "select 'tac_db', count(*), count(*) filter (where brand='Apple') from tac_db union all select 'device_hints', count(*), count(*) filter (where key like 'part:%') from device_hints union all select 'apple_models', count(*), 0 from apple_models union all select 'units с IMEI', count(*) filter (where imei is not null), count(*) from units"
          echo "== функции"; q "select p.proname, pg_get_function_identity_arguments(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('device_lookup','tac_stats','tac_catalog_model','apple_part_base','imei_luhn_ok','tac_import_start','tac_import_finish','tac_load_csv','is_staff') order by 1"
          echo "== триггер обучения"; q "select tgname, tgenabled from pg_trigger where tgrelid='public.units'::regclass and not tgisinternal"
          echo "== права"; q "select has_function_privilege('authenticated','public.device_lookup(text)','execute'), has_function_privilege('authenticated','public.tac_stats()','execute')"
          echo "== пробный поиск (роль владельца)"
          OWN=$(q "select id from staff where role='owner' and is_active limit 1" | head -1)
          for code in "$(q "select tac||'0000000' from tac_db where brand='Apple' and model ilike 'iPhone 16 Pro%' limit 1" | head -1)" MTUV3ZD/A; do
            echo "-- код вида ${code:0:8}…"
            printf '%s\n' "begin;" "select set_config('request.jwt.claims','{\"sub\":\"$OWN\",\"role\":\"authenticated\"}',true);" "set local role authenticated;" "select left(device_lookup('$code')::text,400);" "rollback;" | docker exec -i supabase-db psql -U postgres -d postgres -qAt 2>&1 | grep -v '^$' | tail -3
          done
          echo "== ошибки базы за час"; docker logs --since 1h supabase-db 2>&1 | grep -iE 'ERROR' | sed -E 's/[0-9]{8,}/<…>/g' | cut -c1-200 | sort | uniq -c | sort -rn | head -10
          echo "== ошибки REST за час"; docker logs --since 1h supabase-rest 2>&1 | grep -iE 'error|4[0-9][0-9] ' | cut -c1-200 | tail -5
          SH
      - name: Количество записей в справочниках
        if: inputs.stage == 'counts'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -u
          docker exec supabase-db psql -U postgres -d postgres -qAt -F ' | ' </dev/null -c "select relname, n_live_tup from pg_stat_user_tables where schemaname='public' order by relname" 2>&1
          echo "== точные"; for t in apple_models categories services service_prices fin_accounts fin_categories points warehouses products units stock customers staff suppliers pay_rules settings repair_checklist; do printf '%s ' $t; docker exec supabase-db psql -U postgres -d postgres -qAt -c "select count(*) from public.$t" </dev/null 2>&1 | head -1; done
          SH
      - name: Живой сервер снаружи (только чтение)
        if: inputs.stage == 'live'
        run: |
          set -u
          C=https://crm.icase-dzr.ru; A=https://api.icase-dzr.ru
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "== HTTPS и перенаправления"
          for u in http://crm.icase-dzr.ru https://icase-dzr.ru https://www.icase-dzr.ru $C/ $C/index.html $C/sw.js $C/js/config.js; do printf '%-36s %s → %s\n' "$u" "$(code -I "$u")" "$(curl -s -o /dev/null -w '%{redirect_url}' "$u")"; done
          echo "== сертификат"; echo | openssl s_client -connect crm.icase-dzr.ru:443 -servername crm.icase-dzr.ru 2>/dev/null | openssl x509 -noout -enddate -issuer
          echo "== заголовки CRM"; curl -sI $C/ | grep -iE '^(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|cache-control|server):' || true
          echo "== время загрузки"; for f in / js/core.js js/pos.js styles.css js/vendor/supabase.js; do curl -s -o /dev/null -w "$f %{size_download} байт, %{time_total} с, сжатие: " $C/$f; curl -sI -H 'Accept-Encoding: gzip, br' $C/$f | grep -i '^content-encoding' | tr -d '\r' || echo нет; done
          ANON=$(curl -s $C/js/config.js | grep -o 'eyJ[A-Za-z0-9._-]*' | head -1)
          echo "== аноним к таблицам (ожидается пусто или ошибка)"
          for t in customers sales repairs staff products units fin_ops settings audit_log cash_ops; do printf '%-12s ' $t; curl -s "$A/rest/v1/$t?select=*&limit=1" -H "apikey: $ANON" | cut -c1-90; echo; done
          echo "== аноним к функциям"; for f in device_lookup bot_api_key site_api_key fin_setup claim_owner; do printf '%-14s %s\n' $f "$(code -X POST "$A/rest/v1/rpc/$f" -H "apikey: $ANON" -H 'Content-Type: application/json' -d '{}')"; done
          echo "== edge-функции без ключа"; for f in site-api/catalog bot-api/ping staff-admin evotor; do printf '%-18s %s\n' $f "$(code "$A/functions/v1/$f")"; done
          echo "== настройки входа"; curl -s "$A/auth/v1/settings" -H "apikey: $ANON" | cut -c1-300; echo
          echo "== панель Supabase Studio снаружи"; for u in https://api.icase-dzr.ru/ https://api.icase-dzr.ru/project/default https://crm.icase-dzr.ru:8000/; do printf '%-45s %s\n' "$u" "$(code -m 8 "$u")"; done
