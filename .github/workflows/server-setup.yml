name: Server setup
# Первая установка iCase на новый VPS (и повторная — безопасно): Actions → Server setup → Run workflow.
# Нужны секреты окружения production (Settings → Environments → production):
#   DEPLOY_HOST        — IP сервера
#   DEPLOY_SSH_KEY     — закрытый SSH-ключ, открытая часть которого добавлена пользователю root на сервере
#   BACKUP_PASSPHRASE  — (необязательно) пароль шифрования бэкапов; если нет — создаётся сам
#   OWNER_PASSWORD     — (необязательно) временный пароль владельца CRM; если нет — создаётся сам
#   Созданные пароли в журнал не выводятся: они записываются на сервер в /root/icase-secrets.txt (только root).
#   необязательно: S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY · SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS · ALERT_TG_TOKEN ALERT_TG_CHAT
# Секреты в журнал не попадают: GitHub их маскирует, а скрипт передаёт их на сервер только через ssh.
on:
  workflow_dispatch:
    inputs:
      domain: { description: "Домен (например icase52.ru) — будут crm.<домен> и api.<домен>", required: true }
      email: { description: "Почта владельца: вход в CRM и уведомления Let's Encrypt", required: true }
      rewrite_env: { description: "Перезаписать /etc/icase/icase.env, если он уже есть", type: boolean, default: false }
concurrency: { group: deploy-production, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  setup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      H: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: ${{ inputs.domain }}
      OWNER: ${{ inputs.email }}
    steps:
      - name: Проверка настроек
        env:
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          BP: ${{ secrets.BACKUP_PASSPHRASE }}
          OP: ${{ secrets.OWNER_PASSWORD }}
        run: |
          miss=""; [ -n "$H" ] || miss="$miss DEPLOY_HOST"; [ -n "$K" ] || miss="$miss DEPLOY_SSH_KEY"
          [ -z "$miss" ] || { echo "::error::Не заданы секреты окружения production:$miss"; exit 1; }
          gen() { openssl rand -base64 48 | tr -d '/+=\n' | cut -c1-"$1"; }
          if [ -z "$BP" ]; then g=$(gen 32); echo "::add-mask::$g"; echo "GEN_BP=$g" >> "$GITHUB_ENV"; echo "пароль бэкапов будет создан автоматически"
          elif [ ${#BP} -lt 16 ]; then echo "::error::BACKUP_PASSPHRASE короче 16 символов"; exit 1; fi
          if [ -z "$OP" ]; then g=$(gen 16); echo "::add-mask::$g"; echo "GEN_OP=$g" >> "$GITHUB_ENV"; echo "пароль владельца будет создан автоматически"
          elif [ ${#OP} -lt 10 ]; then echo "::error::OWNER_PASSWORD короче 10 символов"; exit 1; fi
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+\.[a-z]{2,}$ ]] || [[ "$DOMAIN" =~ ^xn--[a-z0-9.-]+$ ]] || { echo "::error::Домен указан неверно: $DOMAIN"; exit 1; }
          [[ "$OWNER" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::Почта указана неверно"; exit 1; }
      - uses: actions/checkout@v4
      - name: SSH
        env: { K: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          # вставка из буфера может принести \r и пробелы в начале строк — убираем
          printf '%s\n' "$K" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^$/d' > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          head -1 ~/.ssh/id_deploy | grep -q '^-----BEGIN .*PRIVATE KEY-----$' || { echo "::error::DEPLOY_SSH_KEY должен начинаться со строки -----BEGIN OPENSSH PRIVATE KEY-----"; exit 1; }
          tail -1 ~/.ssh/id_deploy | grep -q '^-----END .*PRIVATE KEY-----$' || { echo "::error::DEPLOY_SSH_KEY должен заканчиваться строкой -----END OPENSSH PRIVATE KEY----- (ключ вставлен не целиком?)"; exit 1; }
          if ! err=$(ssh-keygen -y -P '' -f ~/.ssh/id_deploy 2>&1 > ~/.ssh/id_deploy.pub); then
            case "$err" in *passphrase*) echo "::error::Ключ защищён паролем — для GitHub нужен ключ без пароля (ssh-keygen ... -N \"\")";;
              *) echo "::error::DEPLOY_SSH_KEY не читается как закрытый ключ OpenSSH ($(echo "$err" | head -1 | tr -cd '[:alnum:] :._-')); строк в ключе: $(wc -l < ~/.ssh/id_deploy)";; esac
            exit 1
          fi
          echo "ключ: $(ssh-keygen -lf ~/.ssh/id_deploy.pub | awk '{print $2, $NF}')"
          ssh-keyscan -T 20 -t ed25519 "$H" 2>/dev/null > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Сервер не отвечает по SSH (порт 22)"; exit 1; }
          echo "Отпечаток ключа сервера (сверьте с панелью провайдера):"; ssh-keygen -lf ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 root@"$H" 'grep -E "^(NAME|VERSION_ID)=" /etc/os-release; nproc; free -g | awk "/Mem:/{print \$2\" ГБ ОЗУ\"}"; df -h / | tail -1' \
            || { echo "::error::Не удалось войти root по ключу. Добавьте открытую часть DEPLOY_SSH_KEY в /root/.ssh/authorized_keys"; exit 1; }
      - name: Сервер свободен (порты 80/443, место на диске)
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -u
          . /etc/os-release; echo "система: $PRETTY_NAME"
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9); echo "свободно на диске: ${free} ГБ"
          [ "$free" -ge 25 ] || { echo "::error::нужно хотя бы 25 ГБ свободного места"; exit 1; }
          busy=$(ss -Hltnp '( sport = :80 or sport = :443 )' | grep -v -E 'docker-proxy|caddy' || true)
          if [ -n "$busy" ]; then
            echo "::error::порты 80/443 заняты другой программой — её нужно остановить, иначе сайт CRM не откроется:"; echo "$busy" | sed -E 's/.*users:\(\("([^"]+)".*/  \1/' | sort -u; exit 1
          fi
          # чужие контейнеры Docker, которые займут 80/443 после перезапуска Docker (политика restart: always / unless-stopped)
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            foreign=$(docker ps -aq | xargs -r docker inspect --format '{{.Name}}|{{index .Config.Labels "com.docker.compose.project"}}|{{.HostConfig.RestartPolicy.Name}}|{{.State.Status}}|{{range $p, $b := .HostConfig.PortBindings}}{{range $b}}{{.HostPort}} {{end}}{{end}}' \
              | awk -F'|' '$2!="supabase" && $1!="/icase-caddy" && $5 ~ /(^| )(80|443)( |$)/')
            if [ -n "$foreign" ]; then
              echo "::error::на сервере есть другие контейнеры Docker на портах 80/443 — они помешают CRM:"
              echo "$foreign" | awk -F'|' '{printf "  %s (проект %s, перезапуск %s, сейчас %s, порты %s)\n", substr($1,2), ($2==""?"—":$2), $3, $4, $5}'; exit 1
            fi
            echo "контейнеры Docker на сервере:"; docker ps -a --format '  {{.Names}} · {{.Status}}' | head -20
          fi
          echo "порты 80 и 443 свободны"
          systemctl is-active --quiet docker && echo "Docker уже установлен: $(docker --version)" || echo "Docker будет установлен"
          SH
      - name: Настройки сервера (/etc/icase/icase.env)
        env:
          REWRITE: ${{ inputs.rewrite_env }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
          ALERT_TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
        run: |
          S="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes root@$H"
          if $S 'test -s /etc/icase/icase.env' && [ "$REWRITE" != "true" ]; then echo "/etc/icase/icase.env уже есть — оставляю как есть"; exit 0; fi
          umask 077
          export BACKUP_PASSPHRASE="${BACKUP_PASSPHRASE:-${GEN_BP:-}}"
          python3 - > /tmp/icase.env <<'PY'
          import os, re, shlex
          s = open("deploy/icase.env.example").read()
          d = os.environ["DOMAIN"]; e = os.environ["OWNER"]
          v = {"CRM_DOMAIN": "crm." + d, "API_DOMAIN": "api." + d, "ACME_EMAIL": e, "BACKUP_PASSPHRASE": os.environ["BACKUP_PASSPHRASE"]}
          for k in ["S3_ENDPOINT", "S3_REGION", "S3_BUCKET", "S3_ACCESS_KEY", "S3_SECRET_KEY", "SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASS"]:
              if os.environ.get(k): v[k] = os.environ[k]
          if os.environ.get("SMTP_USER"): v["SMTP_ADMIN_EMAIL"] = os.environ["SMTP_USER"]
          if not os.environ.get("S3_ACCESS_KEY"): v.update({"S3_ACCESS_KEY": "", "S3_SECRET_KEY": ""})
          for k, x in v.items():
              line = "%s=%s" % (k, shlex.quote(x) if x else "")
              s = re.sub(r"(?m)^%s=.*$" % k, lambda m, line=line: line, s)
          for k in ["ALERT_TG_TOKEN", "ALERT_TG_CHAT"]:
              if os.environ.get(k): s += "\n%s=%s" % (k, shlex.quote(os.environ[k]))
          print(s)
          PY
          bash -n /tmp/icase.env && (set -a; . /tmp/icase.env) || { echo "::error::файл настроек не читается"; exit 1; }
          $S 'install -d -m 700 /etc/icase && cat > /etc/icase/icase.env.new && chmod 600 /etc/icase/icase.env.new && mv /etc/icase/icase.env.new /etc/icase/icase.env' < /tmp/icase.env
          rm -f /tmp/icase.env
          if [ -n "${GEN_BP:-}" ]; then
            printf 'BACKUP_PASSPHRASE (пароль бэкапов, сохраните копию вне сервера): %s\n' "$GEN_BP" | $S 'umask 077; cat >> /root/icase-secrets.txt'
          fi
          echo "настройки записаны: crm.$DOMAIN, api.$DOMAIN$( [ -n "$S3_ACCESS_KEY" ] && echo ', бэкапы в S3' || echo ', бэкапы только на сервере — добавьте S3 позже')$( [ -n "$SMTP_PASS" ] && echo ', почта' )"
      - name: DNS
        run: |
          command -v dig >/dev/null || sudo apt-get install -y -qq dnsutils >/dev/null
          ip=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'curl -fsS -4 -m 10 https://ifconfig.me || hostname -I | cut -d" " -f1')
          ok=1; for n in crm api; do a=$(dig +short A "$n.$DOMAIN" @1.1.1.1 | tail -1); echo "$n.$DOMAIN → ${a:-нет записи} (сервер $ip)"; [ "$a" = "$ip" ] || ok=0; done
          [ $ok = 1 ] || { echo "::error::A-записи crm.$DOMAIN и api.$DOMAIN должны указывать на $ip. Добавьте их у регистратора, подождите 5–30 минут и запустите снова"; exit 1; }
      - name: install.sh (Docker, Supabase, файрвол, бэкапы)
        run: |
          git archive --format=tar.gz -o /tmp/src.tar.gz HEAD -- deploy
          S="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes root@$H"
          $S 'rm -rf /root/icase-deploy && mkdir -p /root/icase-deploy && tar -C /root/icase-deploy -xzf -' < /tmp/src.tar.gz
          $S "bash /root/icase-deploy/deploy/install.sh '$(cat ~/.ssh/id_deploy.pub)'"
      - name: Первая выкладка версии
        run: |
          V="$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)"
          git archive --format=tar.gz -o "/tmp/$V.tar.gz" HEAD -- index.html styles.css sw.js manifest*.webmanifest icons js db deploy supabase
          scp -i ~/.ssh/id_deploy -o BatchMode=yes "/tmp/$V.tar.gz" "deploy@$H:incoming/$V.tar.gz"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "deploy@$H" "sudo /opt/icase/bin/icase-release $V"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Владелец и таймеры
        env: { OWNER_PASSWORD: "${{ secrets.OWNER_PASSWORD }}" }
        run: |
          S="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes root@$H"
          if $S "docker exec supabase-db psql -U postgres -qAt -c \"select 1 from public.staff where role='owner' limit 1\"" | grep -q 1; then echo "владелец уже есть"
          else
            OP="${OWNER_PASSWORD:-${GEN_OP:-}}"
            printf '%s' "$OP" | $S "OWNER_PASSWORD=\$(cat) /opt/icase/app/deploy/create-owner.sh '$OWNER' 'Владелец'"
            if [ -z "${OWNER_PASSWORD:-}" ]; then
              printf 'Вход в CRM: %s / %s (смените после первого входа)\n' "$OWNER" "$GEN_OP" | $S 'umask 077; cat >> /root/icase-secrets.txt'
              echo "GEN_OWNER=1" >> "$GITHUB_ENV"
            fi
          fi
          $S 'systemctl start icase-backup.timer icase-health.timer && systemctl list-timers "icase-*" --no-pager'
      - name: Итог
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" /opt/icase/app/deploy/healthcheck.sh
          kh=$(cut -d" " -f2- ~/.ssh/known_hosts)   # без IP: он остаётся только в секрете DEPLOY_HOST
          {
            echo "### iCase установлен · версия \`$V\`"
            if [ -n "${GEN_OWNER:-}" ]; then echo "- CRM: https://crm.$DOMAIN — вход: $OWNER, пароль создан автоматически и лежит на сервере: \`cat /root/icase-secrets.txt\` (смените в «Профиль → Пароль»)"
            else echo "- CRM: https://crm.$DOMAIN — вход: $OWNER и пароль из секрета OWNER_PASSWORD (смените в «Профиль → Пароль»)"; fi
            echo "- API для сайта: https://api.$DOMAIN/functions/v1/site-api"
            echo "- **Добавьте секрет DEPLOY_KNOWN_HOSTS** (окружение production) — ключ сервера ниже; без него автоматическая выкладка из main не пойдёт:"
            echo '```'; echo "$kh"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
