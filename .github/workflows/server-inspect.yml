name: Server inspect
# Только чтение: что запущено на сервере и кто занимает 80/443 (для диагностики). Секретов не выводит.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env: { H: "${{ secrets.DEPLOY_HOST }}" }
    steps:
      - name: SSH
        env: { K: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^$/d' > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 20 -t ed25519 "$H" 2>/dev/null > ~/.ssh/known_hosts
      - name: Что на сервере
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          echo "== слушают 80/443"; ss -Hltnp '( sport = :80 or sport = :443 )' | sed -E 's/.*:([0-9]+) .*users:\(\("([^"]+)",pid=([0-9]+).*/  порт \1 — \2 (pid \3)/' | sort -u
          echo "== контейнеры icase-review"
          for c in $(docker ps -a --format '{{.Names}}' | grep -v -E '^(supabase-|realtime-dev|icase-caddy$)'); do
            docker inspect --format '  {{.Name}} · сеть {{.HostConfig.NetworkMode}} · порты {{range $p,$b := .HostConfig.PortBindings}}{{$p}}→{{range $b}}{{.HostPort}}{{end}} {{end}}· образ {{.Config.Image}} · {{.State.Status}} · рабочая папка {{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$c"
            docker inspect --format '{{range .Config.ExposedPorts}}{{end}}{{range $p, $_ := .Config.ExposedPorts}}    открыт внутри: {{$p}}{{"\n"}}{{end}}' "$c"
          done
          echo "== сети"; docker network ls --format '  {{.Name}}' | grep -v -E '^  (bridge|host|none)$'
          cad=$(docker ps -a --format '{{.Names}}' | grep -E 'review.*caddy' | head -1)
          if [ -n "$cad" ]; then
            echo "== сайты в Caddy $cad (адреса и куда проксируют)"
            cf=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "$cad")
            echo "  файл: ${cf:-внутри контейнера}"
            { [ -n "$cf" ] && cat "$cf" || docker exec "$cad" cat /etc/caddy/Caddyfile; } 2>/dev/null \
              | grep -E '^[^#[:space:]].*\{|reverse_proxy|root |file_server|handle|redir' | sed -E 's/(basicauth|basic_auth).*/\1 …/' | sed 's/^/  /'
            echo "== монтирования $cad"; docker inspect --format '{{range .Mounts}}  {{.Source}} → {{.Destination}}{{"\n"}}{{end}}' "$cad"
          fi
          echo "== Caddy на самом сервере (вне Docker)"
          systemctl is-active caddy 2>/dev/null | sed 's/^/  служба caddy: /'; command -v caddy >/dev/null && echo "  $(caddy version | cut -c1-40)"
          ls -la /etc/caddy 2>/dev/null | sed 's/^/  /'
          [ -f /etc/caddy/Caddyfile ] && grep -nE '^[^#[:space:]].*\{|^\s*import|reverse_proxy|^\{|email' /etc/caddy/Caddyfile | sed -E 's/(basicauth|basic_auth).*/\1 …/' | sed 's/^/  /'
          echo "== DNS сайтов (A-записи на этот сервер)"; for d in icase-dzr.ru crm.icase-dzr.ru api.icase-dzr.ru; do echo "  $d → $(getent hosts $d | awk '{print $1}' | head -1)"; done
          # бот Telegram (служба icase-bot): только устройство — без значений настроек и секретов (журнал публичный)
          mask() { sed -E 's/[A-Za-z0-9_+\/=:-]{24,}/***/g; s#(://)[^/@ ]+@#\1***@#g'; }
          echo "== службы с bot в имени"; systemctl list-units --type=service --all --no-legend 2>/dev/null | grep -i bot | sed 's/^/  /'
          for u in $(systemctl list-units --type=service --all --no-legend 2>/dev/null | awk '{print $1}' | grep -i bot); do
            echo "== $u"; systemctl cat "$u" 2>/dev/null | grep -vE '^\s*#' | sed -E 's/^(Environment=[^=]+)=.*/\1=…/' | mask | sed 's/^/  /'
            pid=$(systemctl show -p MainPID --value "$u"); [ "${pid:-0}" != 0 ] && { echo "  процесс: $(tr '\0' ' ' < /proc/$pid/cmdline | mask)"; echo "  папка: $(readlink /proc/$pid/cwd)"; echo "  переменные (только имена): $(tr '\0' '\n' < /proc/$pid/environ | cut -d= -f1 | grep -vE '^(PATH|HOME|LANG|USER|LOGNAME|SHELL|INVOCATION_ID|JOURNAL_STREAM|SYSTEMD_EXEC_PID|PWD|SHLVL|_)$' | tr '\n' ' ')"; echo "  слушает: $(ss -Hltnp | grep "pid=$pid," | awk '{print $4}' | tr '\n' ' ')"; d=$(readlink /proc/$pid/cwd)
              echo "  файлы:"; find "$d" -maxdepth 2 -not -path '*/node_modules*' -not -path '*/.git/*' -not -path '*/venv*' -not -path '*/__pycache__*' 2>/dev/null | head -60 | sed "s#^$d#    .#"
              git -C "$d" remote -v 2>/dev/null | head -1 | mask | sed 's/^/  git: /'; git -C "$d" log -1 --format='  коммит: %h %ci %s' 2>/dev/null
              for f in "$d"/package.json "$d"/requirements.txt "$d"/pyproject.toml; do [ -f "$f" ] && { echo "  $(basename "$f"):"; grep -vE 'token|secret|password' -i "$f" | head -40 | sed 's/^/    /'; }; done
              echo "  адреса и API в коде:"; grep -rhoE "https?://[A-Za-z0-9._/{}:-]+|/api/[A-Za-z0-9/_{}-]+|(rest|wc)/v[0-9]+/[A-Za-z0-9/_-]+|functions/v1/[A-Za-z0-9/_-]+" "$d" --include=*.py --include=*.js --include=*.ts --include=*.mjs 2>/dev/null | grep -v node_modules | mask | sort | uniq -c | sort -rn | head -40 | sed 's/^/    /'
              :; }
          done
          SH
