# Связь бота Telegram (/opt/icase-bot) с CRM.
#   stage=key   — показать открытый ключ сервера для шифрования обновления бота (создаётся один раз в /root/.icase-bot-update.pem)
#   stage=apply — поставить обновление бота из ветки bot-update-enc (зашифровано ключом сервера), создать ключ бота в CRM,
#                 записать CRM_API_URL и CRM_BOT_KEY в /opt/icase-bot/.env и перезапустить бота.
#                 Перед заменой проверяется, что файлы бота на сервере не менялись (иначе — стоп); при сбое всё возвращается.
#   stage=compare — только чтение: сравнить остатки МоегоСклада (кэш бота) с остатками CRM по артикулу и штрихкоду.
#   stage=inspect — только чтение: режим бота, имена настроек, адреса сайтов в настройках и коде, ошибки в журнале (без значений ключей).
#   stage=crm-on / crm-off — включить или выключить режим CRM в боте (CRM_MODE в .env): склад, продажи, клиенты,
#                 правка карточек и переоценка берутся из CRM вместо МоегоСклада. При сбое настройки возвращаются.
# Секреты не покидают сервер: ключ бота создаётся и записывается прямо там.
name: Bot connect
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "key, apply, compare, crm-on, crm-off или inspect"
        required: true
        default: key
permissions:
  contents: read
concurrency: { group: server, cancel-in-progress: false }
jobs:
  bot:
    runs-on: ubuntu-latest
    environment: production
    env:
      H: ${{ secrets.DEPLOY_HOST }}
      STAGE: ${{ inputs.stage }}
    steps:
      - name: SSH
        env: { K: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          case "$STAGE" in key|apply|compare|crm-on|crm-off|inspect) ;; *) echo "stage: key, apply, compare, crm-on, crm-off или inspect"; exit 1;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^$/d' > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 20 -t ed25519 "$H" 2>/dev/null > ~/.ssh/known_hosts
      - name: Ключ сервера для обновлений бота
        if: inputs.stage == 'key'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -e
          K=/root/.icase-bot-update.pem
          [ -f "$K" ] || { umask 077; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$K" 2>/dev/null; }
          echo "открытый ключ (base64):"; openssl pkey -in "$K" -pubout | base64 -w0; echo
          SH
      - uses: actions/checkout@v4
        if: inputs.stage == 'apply'
        with: { ref: bot-update-enc, path: upd }
      - name: Обновление бота и связь с CRM
        if: inputs.stage == 'apply'
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes upd/update.tgz.enc upd/pass.enc root@"$H":/root/
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -euo pipefail
          B=/opt/icase-bot; T=$(mktemp -d); trap 'rm -rf "$T" /root/update.tgz.enc /root/pass.enc' EXIT
          openssl pkeyutl -decrypt -inkey /root/.icase-bot-update.pem -pkeyopt rsa_padding_mode:oaep -in /root/pass.enc -out "$T/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in /root/update.tgz.enc -pass file:"$T/pass" | tar xz -C "$T"
          echo "== проверка: файлы бота на сервере те же, на которых сделано обновление"
          ( cd "$B" && sha256sum -c "$T/base.sha256" ) || { echo "Файлы бота на сервере изменились — обновление не ставлю"; exit 1; }
          echo "== ключ бота в CRM"
          KEY=$(printf '%s\n' "begin;" "select set_config('request.jwt.claims','{\"role\":\"service_role\"}',true);" \
                "select set_config('request.jwt.claim.role','service_role',true);" "select 'KEY:'||public.bot_api_key();" "commit;" \
                | docker exec -i supabase-db psql -U postgres -d postgres -qAt -v ON_ERROR_STOP=1 | sed -n 's/^KEY://p')
          [ ${#KEY} -ge 40 ] || { echo "ключ не получен"; exit 1; }
          . /etc/icase/icase.env
          echo "== копия файлов бота и настроек"
          BK="/var/backups/icase-bot/$(date +%Y%m%d-%H%M%S)"; mkdir -p "$BK"; chmod 700 /var/backups/icase-bot
          (cd "$B" && cp -a --parents $(cd "$T/files" && find . -type f) .env "$BK"/ 2>/dev/null || true)
          cp -a "$B/.env" "$BK/.env"; ls "$BK" | sed 's/^/  /'
          rollback() { echo "!! откат"; (cd "$BK" && find . -type f -name '*.py' -exec cp -a {} "$B/{}" \;); cp -a "$BK/.env" "$B/.env"; (cd "$T/files" && find . -type f) | while read -r f; do [ -f "$BK/$f" ] || rm -f "$B/$f"; done; systemctl restart icase-bot; exit 1; }
          echo "== новые файлы"; (cd "$T/files" && find . -type f | sed 's/^/  /'; cp -a . "$B"/)
          chown -R --reference="$B" "$B/app" 2>/dev/null || true
          PY=$(systemctl show -p ExecStart --value icase-bot | sed -E 's/.*path=([^ ;]+).*/\1/')
          (cd "$B" && "$PY" -m py_compile app/*.py) || rollback
          echo "== настройки .env (только имена)"
          sed -i -E '/^(CRM_API_URL|CRM_BOT_KEY)=/d' "$B/.env"
          printf 'CRM_API_URL=%s\nCRM_BOT_KEY=%s\n' "https://${API_DOMAIN}/functions/v1/bot-api" "$KEY" >> "$B/.env"
          grep -oE '^[A-Z_]+=' "$B/.env" | tr '\n' ' '; echo
          echo "== проверка ключа"; c=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Bot-Key: $KEY" "https://${API_DOMAIN}/functions/v1/bot-api/ping"); echo "  bot-api/ping → $c"
          [ "$c" = 200 ] || rollback
          since=$(date '+%Y-%m-%d %H:%M:%S'); systemctl restart icase-bot; sleep 12
          systemctl is-active --quiet icase-bot || { journalctl -u icase-bot --since "$since" -n 30 --no-pager -o cat | grep -E '^[A-Za-z]+(Error|Exception)|File "/opt' | cut -c1-200; rollback; }
          journalctl -u icase-bot --since "$since" --no-pager -o cat | grep -E 'связь с CRM' | cut -c1-200
          echo "  ошибок в журнале после запуска: $(journalctl -u icase-bot --since "$since" --no-pager -o cat | grep -c ' ERROR ' || true)"
          journalctl -u icase-bot --since "$since" --no-pager -o cat | grep -q 'связь с CRM включена' || { echo "бот не включил связь с CRM"; rollback; }
          echo "Готово: бот работает и связан с CRM. Копия прежних файлов: $BK"
          SH
      - name: Режим CRM в боте
        if: inputs.stage == 'crm-on' || inputs.stage == 'crm-off'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" "STAGE=$STAGE bash -s" <<'SH'
          set -euo pipefail
          B=/opt/icase-bot
          [ -f "$B/app/crm_mode.py" ] || { echo "в боте нет режима CRM — сначала stage=apply"; exit 1; }
          grep -q '^CRM_BOT_KEY=.' "$B/.env" || { echo "бот не связан с CRM — сначала stage=apply"; exit 1; }
          BK="/var/backups/icase-bot/$(date +%Y%m%d-%H%M%S)-env"; mkdir -p "$BK"; cp -a "$B/.env" "$BK/.env"
          sed -i -E '/^CRM_MODE=/d' "$B/.env"
          [ "$STAGE" = crm-on ] && echo 'CRM_MODE=on' >> "$B/.env"
          since=$(date '+%Y-%m-%d %H:%M:%S'); systemctl restart icase-bot; sleep 20
          if ! systemctl is-active --quiet icase-bot; then cp -a "$BK/.env" "$B/.env"; systemctl restart icase-bot; echo "бот не запустился — настройки возвращены"; exit 1; fi
          echo "  ошибок в журнале после запуска: $(journalctl -u icase-bot --since "$since" --no-pager -o cat | grep -c ' ERROR ' || true)"
          if [ "$STAGE" = crm-on ]; then
            DB=$(cd "$B" && grep -E '^DB_PATH=' .env | cut -d= -f2- || true); DB=${DB:-data/icase.db}
            src=$(cd "$B" && python3 -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); r=c.execute(\"select value from kv where key='catalog_source'\").fetchone(); print(r[0] if r else '')" "$DB" 2>/dev/null || true)
            n=$(cd "$B" && python3 -c "import sqlite3,sys,json; c=sqlite3.connect(sys.argv[1]); print(sum(1 for (d,) in c.execute('select data from ms_items where active=1') if json.loads(d).get('source')=='crm'))" "$DB" 2>/dev/null || echo '?')
            echo "  источник каталога: ${src:-нет данных}; товаров из CRM: $n"
            [ "$src" = crm ] || { cp -a "$BK/.env" "$B/.env"; systemctl restart icase-bot; echo "каталог из CRM не загрузился — режим выключен обратно"; exit 1; }
          fi
          echo "Готово: режим CRM в боте — $STAGE. Прежние настройки: $BK/.env"
          SH
      - name: Сравнение остатков МойСклад ↔ CRM
        if: inputs.stage == 'compare'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          set -euo pipefail
          cd /opt/icase-bot
          PY=$(systemctl show -p ExecStart --value icase-bot | sed -E 's/.*path=([^ ;]+).*/\1/')
          "$PY" - <<'PYEOF'
          import json, os, sqlite3, time
          from dotenv import dotenv_values
          import requests
          env = dotenv_values('.env')
          db = sqlite3.connect(env.get('DB_PATH') or 'data/icase.db')
          print('источник кэша бота:', (db.execute("select value from kv where key='catalog_source'").fetchone() or ['moysklad'])[0])
          at = float((db.execute("select value from kv where key='ms_stock_at'").fetchone() or ['0'])[0])
          print('кэш МоегоСклада обновлён', int((time.time() - at) / 60), 'мин назад')
          ms = [json.loads(d) for (d,) in db.execute('select data from ms_items where active=1')]
          ms = [e for e in ms if e.get('type') != 'service' and e.get('source') != 'crm']
          r = requests.get(env['CRM_API_URL'] + '/catalog', headers={'X-Bot-Key': env['CRM_BOT_KEY']}, timeout=60)
          r.raise_for_status()
          crm = r.json()['products']
          by_sku = {p['sku']: p for p in crm if p.get('sku')}
          by_bar = {p['barcode']: p for p in crm if p.get('barcode')}
          diff, missing, same = [], [], 0
          for e in ms:
              p = by_sku.get(e.get('sku')) or next((by_bar[b] for b in e.get('barcodes') or [] if b in by_bar), None)
              qty = float(e.get('stock') or 0)
              if not p:
                  if qty > 0: missing.append((e['title'], qty))
                  continue
              cq = float(p['stock']) + float(p['reserve'])
              if abs(cq - qty) > 1e-6: diff.append((e['title'], qty, cq, bool(p.get('serial_tracked'))))
              else: same += 1
          print('товаров МоегоСклада:', len(ms), '· в CRM:', len(crm), '· остаток совпал:', same)
          print('остаток отличается:', len(diff), '(МойСклад → CRM, * — учёт по IMEI)')
          for t, a, b, s in sorted(diff, key=lambda x: -abs(x[1] - x[2]))[:60]: print(f'  {a:g} → {b:g}{" *" if s else ""}  {t[:90]}')
          print('есть в МоемСкладе с остатком, нет в CRM:', len(missing))
          for t, a in missing[:30]: print(f'  {a:g}  {t[:90]}')
          PYEOF
          SH
      - name: Состояние бота (только чтение)
        if: inputs.stage == 'inspect'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$H" 'bash -s' <<'SH'
          B=/opt/icase-bot
          echo "== служба"; systemctl is-active icase-bot; systemctl show -p ActiveEnterTimestamp --value icase-bot
          echo "== настройки .env: имена"; grep -oE '^[A-Z_]+=' "$B/.env" | tr '\n' ' '; echo
          echo "== режим и адреса (значения без ключей)"; grep -E '^(CRM_MODE|[A-Z_]*(URL|SITE|DOMAIN|HOST|SHOP)[A-Z_]*)=' "$B/.env" | grep -viE 'KEY|TOKEN|PASS|SECRET' | sed -E 's#(https?://[^/:@]+:)[^@]*@#\1***@#'
          echo "== упоминания сайтов в коде"; grep -rnoE "icase52\.ru[^\"' ]*|xn--[a-z0-9-]+\.xn--p1ai[^\"' ]*|айкейс\.рф[^\"' ]*|SITE_URL|SHOP_URL|WOO[A-Z_]*|product-category[^\"' ]*" "$B/app" --include=*.py | sort | uniq -c | sort -rn | head -40
          echo "== источник каталога"; grep -rnE "CRM_MODE" "$B/app" --include=*.py | cut -c1-160 | head -15
          echo "== последние изменения файлов"; find "$B/app" -name '*.py' -printf '%TY-%Tm-%Td %TH:%TM %p\n' | sort -r | head -10
          echo "== каталог в кэше бота"; DB=$(cd "$B" && grep -E '^DB_PATH=' .env | cut -d= -f2- || true); DB=${DB:-data/icase.db}
          (cd "$B" && python3 -c "
          import sqlite3,sys,json,collections
          c=sqlite3.connect(sys.argv[1]); r=c.execute(\"select value from kv where key='catalog_source'\").fetchone(); print('источник:', r[0] if r else 'нет данных')
          n=collections.Counter(json.loads(d).get('source') or 'moysklad' for (d,) in c.execute('select data from ms_items where active=1')); print('товаров по источникам:', dict(n))
          " "$DB" 2>&1 | sed 's/^ *//')
          echo "== ссылки на сайт в коде (контекст)"; grep -rn -B2 -A3 "icase52" "$B/app/store.py" "$B/app/integrations.py" | cut -c1-170
          echo "== где бот берёт доступ к МоемуСкладу (код, без значений)"; grep -rnE "def (_?token|_?auth|_?headers)|Bearer|ms_token|MS_TOKEN|moysklad_token|kv_get\([^)]*(token|login|ms)" "$B/app" --include=*.py | cut -c1-170 | head -15
          echo "== ключи в kv (только имена)"; (cd "$B" && python3 -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); print(' '.join(k for (k,) in c.execute('select key from kv order by key')))" "$DB" 2>&1 | cut -c1-900)
          echo "== источники цен (сайты, без ключей)"; (cd "$B" && python3 -c "
          import sqlite3,sys,json
          c=sqlite3.connect(sys.argv[1])
          for k in ('integrations','price_sources','sources'):
              r=c.execute('select value from kv where key=?',(k,)).fetchone()
              if r:
                  try: v=json.loads(r[0])
                  except Exception: v=r[0]
                  print(k, json.dumps([{x:i.get(x) for x in ('name','url','type','on')} for i in v] if isinstance(v,list) else '…', ensure_ascii=False)[:1500])
          " "$DB" 2>&1 | sed 's/^ *//')
          echo "== журнал: сайт и МойСклад за 24 часа"; journalctl -u icase-bot --since -24h --no-pager -o cat 2>/dev/null | grep -iE 'icase52|наш сайт|woocommerce|МойСклад|moysklad' | sed -E 's/[0-9]{6,}/<…>/g' | cut -c1-200 | sort | uniq -c | sort -rn | head -15
          echo "== служба: откуда ещё берутся настройки (только имена)"; systemctl show icase-bot -p EnvironmentFiles --value; systemctl show icase-bot -p Environment --value | tr ' ' '\n' | sed -E 's/=.*/=/' | tr '\n' ' '; echo
          for f in $(systemctl show icase-bot -p EnvironmentFiles --value | grep -oE '/[^ ]+'); do [ -f "$f" ] && { printf '%s: ' "$f"; grep -oE '^[A-Z_]+=' "$f" | tr '\n' ' '; echo; }; done
          echo "== MOYSKLAD_TOKEN в копиях .env"; for f in /var/backups/icase-bot/*/.env "$B/.env"; do printf '%s: %s\n' "$f" "$(grep -c '^MOYSKLAD_TOKEN=.' "$f" 2>/dev/null)"; done
          echo "== где код пишет или читает MOYSKLAD_TOKEN / ms_enabled"; grep -rnE "MOYSKLAD_TOKEN|ms_enabled|MOYSKLAD" "$B/app" --include=*.py | cut -c1-170 | head -15
          echo "== веб-панель бота: адреса настроек"; grep -rnoE "add_(get|post)\([^)]*\)" "$B/app/webapp.py" | cut -c1-140 | grep -iE "setting|ms|sklad|token|integr|config" | head -20
          echo "== что лежит в первой копии (до обновления 16.11)"; O=/var/backups/icase-bot/20261116-145224; (cd "$O" && find . -type f | sort | head -40)
          echo "== откуда старый бот брал каталог (код копии)"; grep -rnE "catalog_source|BOT_API_URL|script\.google|def (sync_stock|load_catalog|fetch_items|refresh)" "$O" --include=*.py | cut -c1-170 | head -25
          echo "== то же в текущем коде"; grep -rnE "catalog_source" "$B/app" --include=*.py | cut -c1-170 | head -15
          echo "== журнал 16.11 до 15:30 UTC: источник каталога"; journalctl -u icase-bot --since "2026-11-15 00:00" --until "2026-11-16 15:20" --no-pager -o cat 2>/dev/null | grep -iE "каталог|catalog|МойСклад|moysklad|google|api" | sed -E 's/[0-9]{6,}/<…>/g' | cut -c1-180 | sort | uniq -c | sort -rn | head -15
          echo "== настройки МоегоСклада в боте (поля, без значений)"; (cd "$B" && python3 -c "import sqlite3,sys,json; c=sqlite3.connect(sys.argv[1]); r=c.execute(\"select value from kv where key='ms_config'\").fetchone(); d=json.loads(r[0]) if r else {}; print({k:(('задан, '+str(len(str(v)))+' симв.') if any(x in k.lower() for x in ('token','pass','key','secret','login')) else v) for k,v in d.items()})" "$DB" 2>&1 | cut -c1-600)
          echo "== код: откуда берётся ключ"; sed -n '20,60p' "$B/app/moysklad.py" | grep -nE "token|ms_config|cfg|Authorization|def " | cut -c1-170
          echo "== панель бота: страницы и запросы про МойСклад"; grep -rnoE "[\"'](/api/[a-z0-9_/-]*(ms|sklad|moysklad|integr|setting)[a-z0-9_/-]*)[\"']" "$B/app" --include=*.py | sort -u | cut -c1-140 | head -20
          echo "== первая и последняя ошибка 401 в журнале"; journalctl -u icase-bot --no-pager -o short-iso 2>/dev/null | grep "HTTP 401" | sed -n '1p;$p' | cut -c1-60
          echo "== последняя удачная выгрузка МоегоСклада"; journalctl -u icase-bot --no-pager -o short-iso 2>/dev/null | grep -iE "МойСклад|moysklad" | grep -viE "401|error|traceback|File " | tail -3 | sed -E 's/[0-9]{6,}/<…>/g' | cut -c1-170
          echo "== копии (откаты)"; ls -1 /var/backups/icase-bot 2>/dev/null | tail -10
          echo "== ошибки в журнале за 6 часов"; journalctl -u icase-bot --since -6h --no-pager 2>/dev/null | grep -iE 'error|traceback|exception' | sed -E 's/[0-9]{6,}/<…>/g' | cut -c1-200 | sort | uniq -c | sort -rn | head -15
          SH
