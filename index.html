<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCase CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><b>iCase</b><span>CRM</span></div><p class="muted">Загрузка…</p></div></div>
<div class="app" hidden>
  <nav class="rail" id="rail" aria-label="Разделы">
    <div class="brand"><b>iCase</b><span>CRM</span></div>
    <div id="navlist" class="navlist"></div>
    <div class="who" id="who"></div>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <div class="top">
      <button class="btn ghost menu-btn" data-act="menu" aria-label="Меню">☰</button>
      <h1 id="title">Сводка</h1>
      <div class="search">
        <input id="gsearch" type="search" placeholder="Поиск по всему: телефон, IMEI, №, товар  ( / )" autocomplete="off" aria-label="Поиск по базе">
        <div class="results" id="gresults" hidden></div>
      </div>
      <div id="top-acts" class="top-acts"></div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="view" class="view"></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/serial.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/vendor/jsbarcode.min.js"></script>
<script src="js/print.js"></script>
<script src="js/pos.js"></script>
<script src="js/stock.js"></script>
<script src="js/receive.js"></script>
<script src="js/clients.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/site.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/printui.js"></script>
<script src="js/finance.js"></script>
<script src="js/analytics.js"></script>
<script src="js/repairs.js"></script>
<script src="js/purchase.js"></script>
<script src="js/payroll.js"></script>
<script src="js/app.js"></script>
</body>
</html>
